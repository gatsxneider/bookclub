g-surface font-body-md text-body-md text-on-surface antialiased"><main class="w-full min-h-screen bg-surface flex flex-col justify-center items-center px-gutter"><div class="flex flex-col w-full items-center justify-center py-space-xl">
<!-- Cozy Literary Atmosphere Ambient Glows -->
<div class="relative w-full max-w-[520px] flex flex-col items-center">
<!-- Top Warm Decorative Emblem -->
<div class="mb-space-lg flex flex-col items-center text-center">
<div class="relative w-24 h-24 mb-space-sm flex items-center justify-center rounded-full bg-surface-container-high shadow-sm p-2 transition-transform duration-300 hover:scale-105">
<img alt="Cozy Book Club emblem" class="w-full h-full object-contain rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDtUVsGMNKaf5L23ooD65lho3EVBLogs5Ac9ulyarPy0SsmbEze-mdfG18lbgt8u4nvw5nYGdju9YlbPBrkISu-P0L2Qxyi39ymUDRaJq2CTNz2jzgj9E8RzFSXrNjedlHaX0d9OI7jrXpPioMrtL3U5aN0EcgPzGNECvkAQQpJQ_LOqC3YwigrWJgH-vCGBlqbL_c1GmqUehAYfao3BzOhSd1sYx-DPRFu3ecwnS9bC-bgfz-88nvcWA"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">코지 북클럽</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-space-xs font-serif italic">
        "책 한 권으로 연결되는 우리들의 따뜻한 숲"
      </p>
</div>
<!-- Main Container Card -->
<div class="w-full bg-surface-container-lowest rounded-xl shadow-xl p-space-lg sm:p-space-xl relative overflow-hidden transition-all duration-300">
<!-- Top Decorative Accent Strip -->
<div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-primary-fixed via-primary to-secondary-container"></div>
<!-- Segmented Pill Switcher -->
<div class="flex items-center justify-center p-1 bg-surface-container rounded-full mb-space-lg">
<button class="w-1/2 py-2.5 rounded-full font-label-md text-label-md text-on-surface-variant hover:text-primary transition-all duration-200" id="tab-login" onclick="switchMode('login')" type="button">
          로그인
        </button>
<button class="w-1/2 py-2.5 rounded-full font-label-md text-label-md bg-primary text-on-primary shadow-sm transition-all duration-200" id="tab-signup" onclick="switchMode('signup')" type="button">
          회원가입
        </button>
</div>
<!-- Auth Form -->
<form class="flex flex-col gap-y-4" id="auth-form" onsubmit="event.preventDefault();">
<!-- Field 1: Nickname (Sign Up Only) -->
<div class="flex flex-col gap-1.5 transition-all duration-300" id="field-nickname">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-1.5" for="input-nickname">
<span class="material-symbols-outlined text-[18px] text-primary">draw</span>
            닉네임 <span class="font-body-md text-body-md text-on-surface-variant font-normal">(독서클럽에서 사용할 필명)</span>
</label>
<div class="relative">
<input class="w-full bg-surface-container-low text-on-surface placeholder:text-outline/60 px-4 py-3 rounded-lg font-body-md text-body-md outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#32533c]" id="input-nickname" placeholder="예: 책 읽는 다람쥐, 달빛서재" type="text"/>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1 mt-0.5">
<span class="material-symbols-outlined text-[14px]">info</span>
            한글/영문 2~10자 이내 (클럽 서평과 댓글에 표시됩니다)
          </p>
</div>
<!-- Field 2: Email -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-1.5" for="input-email">
<span class="material-symbols-outlined text-[18px] text-primary">mail</span>
            이메일 주소 <span class="font-body-md text-body-md text-on-surface-variant font-normal">(아이디)</span>
</label>
<div class="flex gap-2">
<input class="flex-1 bg-surface-container-low text-on-surface placeholder:text-outline/60 px-4 py-3 rounded-lg font-body-md text-body-md outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#32533c]" id="input-email" placeholder="cozybook@reading.com" type="email"/>
<button class="px-4 py-3 bg-surface-container text-primary font-label-md text-label-md rounded-lg hover:bg-primary-fixed hover:text-on-primary-fixed transition-colors duration-150 whitespace-nowrap shadow-sm" id="btn-verify-email" onclick="checkDuplicate()" type="button">
              중복 확인
            </button>
</div>
<p class="font-label-sm text-label-sm hidden" id="email-feedback"></p>
</div>
<!-- Field 3: Phone Number (Sign Up Only) -->
<div class="flex flex-col gap-1.5 transition-all duration-300" id="field-phone">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-1.5" for="input-phone">
<span class="material-symbols-outlined text-[18px] text-primary">call</span>
            전화번호
          </label>
<div class="relative">
<input class="w-full bg-surface-container-low text-on-surface placeholder:text-outline/60 px-4 py-3 rounded-lg font-body-md text-body-md outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#32533c]" id="input-phone" placeholder="010-1234-5678" type="tel"/>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1 mt-0.5">
<span class="material-symbols-outlined text-[14px]">notifications_active</span>
            독서클럽 모임 일정 및 발제문 알림톡 발송용
          </p>
</div>
<!-- Field 4: Password -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-1.5" for="input-password">
<span class="material-symbols-outlined text-[18px] text-primary">lock</span>
              비밀번호
            </label>
<button class="hidden font-label-sm text-label-sm text-secondary hover:underline cursor-pointer" id="link-forgot-pw" type="button">
              비밀번호 찾기
            </button>
</div>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-low text-on-surface placeholder:text-outline/60 pl-4 pr-11 py-3 rounded-lg font-body-md text-body-md outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#32533c]" id="input-password" placeholder="영문, 숫자, 특수문자 포함 8자 이상" type="password"/>
<button class="absolute right-3 p-1 text-outline hover:text-on-surface focus:outline-none transition-colors" onclick="togglePasswordVisibility()" title="비밀번호 보기/숨기기" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Agreement Checkboxes (Sign Up Only) -->
<div class="flex flex-col gap-2 mt-2 pt-2 bg-surface-container-low p-3.5 rounded-lg" id="field-agreements">
<label class="flex items-start gap-2.5 cursor-pointer group">
<input checked="" class="mt-0.5 w-4 h-4 rounded text-primary focus:ring-0 accent-primary cursor-pointer" id="check-terms" type="checkbox"/>
<span class="font-label-sm text-label-sm text-on-surface group-hover:text-primary transition-colors">
<span class="text-secondary font-semibold">[필수]</span> 이용약관 및 개인정보 처리방침 동의
            </span>
</label>
<label class="flex items-start gap-2.5 cursor-pointer group">
<input class="mt-0.5 w-4 h-4 rounded text-primary focus:ring-0 accent-primary cursor-pointer" id="check-marketing" type="checkbox"/>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-primary transition-colors">
<span class="text-on-surface-variant font-semibold">[선택]</span> 신간 도서 추천 및 따뜻한 클럽 소식 수신 동의
            </span>
</label>
</div>
<!-- Primary Action Button -->
<button class="w-full mt-2 py-3.5 px-6 bg-primary text-on-primary font-title-md text-title-md rounded-full shadow-md hover:bg-primary-container hover:shadow-lg transition-all duration-200 flex items-center justify-center gap-2 active:scale-[0.99]" id="btn-primary-action" type="submit">
<span>코지 북클럽 시작하기</span>
<span class="text-lg">🌿</span>
</button>
</form>
<!-- Divider -->
<div class="relative flex items-center justify-center my-space-lg">
<div class="w-full h-px bg-surface-variant"></div>
<span class="absolute bg-surface-container-lowest px-3 font-label-sm text-label-sm text-outline">
          또는 SNS 계정으로 3초 만에 시작하기
        </span>
</div>
<!-- Social Login Buttons -->
<div class="flex flex-col gap-2.5">
<!-- Kakao -->
<button class="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-lg bg-[#FEE500] text-[#191919] font-label-md text-label-md shadow-sm hover:brightness-95 transition-all duration-150" onclick="handleSocialLogin('Kakao')" type="button">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M12 3C6.477 3 2 6.477 2 10.768c0 2.768 1.848 5.188 4.646 6.516-.205.767-.746 2.793-.854 3.226-.135.534.195.526.41.383.169-.112 2.686-1.826 3.766-2.564.664.095 1.343.146 2.032.146 5.523 0 10-3.477 10-7.707C22 6.477 17.523 3 12 3z"></path>
</svg>
<span>카카오로 시작하기</span>
</button>
<!-- Naver -->
<button class="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-lg bg-[#03C75A] text-white font-label-md text-label-md shadow-sm hover:brightness-95 transition-all duration-150" onclick="handleSocialLogin('Naver')" type="button">
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M16.273 12.845 7.376 0H0v24h7.727V11.155L16.624 24H24V0h-7.727z"></path>
</svg>
<span>네이버로 시작하기</span>
</button>
<!-- Google -->
<button class="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-lg bg-surface-container-low text-on-surface font-label-md text-label-md shadow-sm hover:bg-surface-variant transition-all duration-150" onclick="handleSocialLogin('Google')" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.14z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.36 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.36 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
<span>구글 계정으로 시작하기</span>
</button>
</div>
<!-- Footer Mode Switch Link -->
<div class="mt-space-lg text-center pt-space-md bg-surface-container-low/50 -mx-space-lg sm:-mx-space-xl -mb-space-lg sm:-mb-space-xl p-4">
<p class="font-body-md text-body-md text-on-surface-variant" id="switch-prompt">
          이미 코지 북클럽 회원이신가요? 
          <button class="text-secondary font-title-sm text-title-sm hover:underline ml-1" onclick="switchMode('login')" type="button">로그인하기</button>
</p>
</div>
</div>
<!-- Literary Footnote Warm Quote -->
<div class="mt-space-lg text-center max-w-sm px-4">
<div class="flex items-center justify-center gap-2 mb-1.5 text-primary/60">
<span class="w-6 h-px bg-outline/30"></span>
<span class="material-symbols-outlined text-[16px]">menu_book</span>
<span class="w-6 h-px bg-outline/30"></span>
</div>
<p class="font-body-reading text-body-reading text-on-surface-variant italic text-sm">
        "천천히 걸어 들어오세요, 당신의 서재가 기다리고 있습니다."
      </p>
</div>
</div>
</div>
<script>
  let currentMode = 'signup';

  function switchMode(mode) {
    currentMode = mode;
    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const fieldNickname = document.getElementById('field-nickname');
    const fieldPhone = document.getElementById('field-phone');
    const fieldAgreements = document.getElementById('field-agreements');
    const btnAction = document.getElementById('btn-primary-action');
    const btnVerifyEmail = document.getElementById('btn-verify-email');
    const linkForgotPw = document.getElementById('link-forgot-pw');
    const switchPrompt = document.getElementById('switch-prompt');

    if (mode === 'login') {
      tabLogin.className = "w-1/2 py-2.5 rounded-full font-label-md text-label-md bg-primary text-on-primary shadow-sm transition-all duration-200";
      tabSignup.className = "w-1/2 py-2.5 rounded-full font-label-md text-label-md text-on-surface-variant hover:text-primary transition-all duration-200";
      
      fieldNickname.classList.add('hidden');
      fieldPhone.classList.add('hidden');
      fieldAgreements.classList.add('hidden');
      btnVerifyEmail.classList.add('hidden');
      linkForgotPw.classList.remove('hidden');

      btnAction.innerHTML = '<span>코지 북클럽 서재 열기</span><span class="material-symbols-outlined text-[20px]">door_open</span>';
      switchPrompt.innerHTML = '아직 회원이 아니신가요? <button type="button" onclick="switchMode(\'signup\')" class="text-secondary font-title-sm text-title-sm hover:underline ml-1">회원가입하기</button>';
    } else {
      tabSignup.className = "w-1/2 py-2.5 rounded-full font-label-md text-label-md bg-primary text-on-primary shadow-sm transition-all duration-200";
      tabLogin.className = "w-1/2 py-2.5 rounded-full font-label-md text-label-md text-on-surface-variant hover:text-primary transition-all duration-200";
      
      fieldNickname.classList.remove('hidden');
      fieldPhone.classList.remove('hidden');
      fieldAgreements.classList.remove('hidden');
      btnVerifyEmail.classList.remove('hidden');
      linkForgotPw.classList.add('hidden');

      btnAction.innerHTML = '<span>코지 북클럽 시작하기</span><span class="text-lg">🌿</span>';
      switchPrompt.innerHTML = '이미 코지 북클럽 회원이신가요? <button type="button" onclick="switchMode(\'login\')" class="text-secondary font-title-sm text-title-sm hover:underline ml-1">로그인하기</button>';
    }
  }

  function togglePasswordVisibility() {
    const pwInput = document.getElementById('input-password');
    const eyeIcon = document.getElementById('eye-icon');
    if (pwInput.type === 'password') {
      pwInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      pwInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  function checkDuplicate() {
    const emailInput = document.getElementById('input-email');
    const feedback = document.getElementById('email-feedback');
    const val = emailInput.value.trim();

    if (!val || !val.includes('@')) {
      feedback.textContent = '올바른 이메일 주소를 먼저 입력해주세요.';
      feedback.className = 'font-label-sm text-label-sm text-error block mt-0.5';
      return;
    }

    feedback.textContent = '사용 가능한 따뜻한 서재 이메일입니다 📖';
    feedback.className = 'font-label-sm text-label-sm text-primary block mt-0.5';
  }

  function handleSocialLogin(provider) {
    alert(provider + ' 간편 계정 연동을 진행합니다.');
  }
</script></main></body></html>
